<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://hor-katha-api.bosctechedu.workers.dev; base-uri 'none'; form-action 'none';">
<meta name="robots" content="noindex">
<title>Certificate Verification · BOSC Tech &amp; Edu</title>
<style>
  :root { --ok:#15803d; --bad:#b91c1c; --warn:#b45309; --ink:#0f172a; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; background:#f1f5f9; color:var(--ink); }
  .wrap { max-width:560px; margin:32px auto; padding:0 16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(15,23,42,.08); overflow:hidden; }
  .head { padding:22px 24px; color:#fff; }
  .head.ok { background:linear-gradient(135deg,#15803d,#22c55e); }
  .head.bad { background:linear-gradient(135deg,#b91c1c,#ef4444); }
  .head.warn { background:linear-gradient(135deg,#b45309,#f59e0b); }
  .head.wait { background:linear-gradient(135deg,#334155,#64748b); }
  .head h1 { margin:0 0 4px; font-size:1.35rem; }
  .head p { margin:0; opacity:.92; font-size:.92rem; }
  .body { padding:20px 24px 8px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid #e2e8f0; font-size:.95rem; }
  .row:last-child { border-bottom:0; }
  .row span:first-child { color:var(--muted); }
  .row span:last-child { font-weight:700; text-align:right; word-break:break-word; }
  .mono { font-family:ui-monospace,Consolas,monospace; }
  .foot { padding:14px 24px 20px; font-size:.8rem; color:var(--muted); }
  .brand { text-align:center; margin-top:16px; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head wait" id="head"><h1 id="title">जाँच हो रही है…</h1><p id="sub">Verifying certificate</p></div>
    <div class="body" id="details"></div>
    <div class="foot" id="foot"></div>
  </div>
  <div class="brand">BOSC Tech &amp; Edu · Hoṛ Katha Suite</div>
</div>
<script>
(function () {
  'use strict';
  // Worker के TRIAL_SIGNING_KEY की public key (वही key जो index.html में है)
  const PUBLIC_KEY = {"kty":"EC","x":"pQZtWailju2QItOKLvsHFJ6H_N-sxKc-xpJtmM949Ws","y":"RVSIGCnR4EaFhUI8znzkexJrsN4GigrpzHFWQyUP5eg","crv":"P-256"};
  const API = 'https://hor-katha-api.bosctechedu.workers.dev';
  const CATS = { basic: 'Basic Level', advanced: 'Advanced Level', job: 'Job Oriented Level' };

  const $ = id => document.getElementById(id);
  function setState(kind, title, sub) {
    $('head').className = 'head ' + kind;
    $('title').textContent = title;
    $('sub').textContent = sub;
  }
  function addRow(label, value, mono) {
    const row = document.createElement('div'); row.className = 'row';
    const a = document.createElement('span'); a.textContent = label;
    const b = document.createElement('span'); b.textContent = value; if (mono) b.className = 'mono';
    row.append(a, b); $('details').appendChild(row);
  }
  function b64urlToBytes(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    const bin = atob(s); const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fmtDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return isNaN(d) ? iso : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  async function run() {
    const q = new URLSearchParams(location.search);
    const token = q.get('c'), sig = q.get('s');

    if (!token || !sig) {
      setState('warn', 'असत्यापित Certificate', 'This link has no digital signature');
      $('foot').textContent = 'यह पुराने तरीके का लिंक है जिसमें डिजिटल हस्ताक्षर नहीं है, इसलिए इसकी जानकारी पर भरोसा नहीं किया जा सकता। नए certificates में QR/लिंक अपने-आप सत्यापित होते हैं।';
      return;
    }

    let cert;
    try {
      const key = await crypto.subtle.importKey('jwk', PUBLIC_KEY, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, b64urlToBytes(sig), new TextEncoder().encode(token));
      if (!ok) throw new Error('bad signature');
      cert = JSON.parse(new TextDecoder().decode(b64urlToBytes(token)));
      if (!cert || cert.typ !== 'cert') throw new Error('wrong type');
    } catch (e) {
      setState('bad', '❌ नकली या बदला हुआ Certificate', 'Signature invalid — this certificate is not genuine');
      $('foot').textContent = 'इस लिंक की जानकारी BOSC के डिजिटल हस्ताक्षर से मेल नहीं खाती।';
      return;
    }

    addRow('नाम / Name', cert.name);
    addRow('Certificate No', cert.no, true);
    addRow('Level', CATS[cert.cat] || cert.cat);
    if (cert.lesson) addRow('Lesson', cert.lesson);
    addRow('Speed', cert.wpm + ' WPM');
    addRow('Accuracy', cert.acc + '%');
    addRow('Grade', cert.grade);
    addRow('Test Duration', cert.dur);
    addRow('Date', fmtDate(cert.date));

    setState('ok', '✅ सत्यापित Certificate', 'Digitally signed by BOSC Tech & Edu');
    $('foot').textContent = 'ऑनलाइन रिकॉर्ड जाँचा जा रहा है…';

    try {
      const res = await fetch(`${API}/cert?no=${encodeURIComponent(cert.no)}`, { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.found && data.revoked) {
        setState('bad', '⛔ रद्द (Revoked) Certificate', 'This certificate has been revoked by BOSC');
        $('foot').textContent = 'यह certificate जारी हुआ था पर बाद में रद्द कर दिया गया।';
      } else if (res.ok && data.found) {
        $('foot').textContent = 'BOSC के ऑनलाइन रिकॉर्ड में दर्ज है। जारी: ' + new Date(cert.iat).toLocaleString('en-IN');
      } else {
        $('foot').textContent = 'हस्ताक्षर सही है। ऑनलाइन रिकॉर्ड अभी उपलब्ध नहीं है।';
      }
    } catch (e) {
      $('foot').textContent = 'हस्ताक्षर सही है। ऑनलाइन रिकॉर्ड जाँच नहीं हो सकी (internet?)।';
    }
  }
  run();
})();
</script>
</body>
</html>
